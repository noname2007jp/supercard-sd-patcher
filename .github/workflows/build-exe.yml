# File: .github/workflows/build-exe.yml
name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file EXE
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller py7zr
          set "ADD_DATA=--add-data patches;patches"
          if exist sav set "ADD_DATA=%ADD_DATA% --add-data sav;sav"
          if exist rts set "ADD_DATA=%ADD_DATA% --add-data rts;rts"
          if exist oldromnumbers.txt set "ADD_DATA=%ADD_DATA% --add-data oldromnumbers.txt;."
          pyinstaller --noconfirm --clean --onefile --noconsole --name supercard-patcher %ADD_DATA% supercard_patcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: supercard-patcher-win-x64
          path: dist/supercard-patcher.exe
